; ============================================================================
;  NSMMI (逆水寒 Model Importer) v1.0.0
;  基于 3DMigoto 1.4.9 (bo3b) - 逆水寒手游 PC 端 (nshm.exe) 定制
;  引擎: Unity IL2CPP  |  图形 API: D3D11 (x64)
;
;  !!! 重要风险提示 !!!
;  该游戏带有网易 NEAC 反作弊。加载器以「进程注入」方式工作（3dmloader.dll 注入 d3d11.dll），
;  存在被检测导致账号处罚的风险，请自行评估，仅用于合规场景。
;
;  本文件位于 NSMMI 工作目录（%APPDATA%\NSMMI\Loader），游戏目录不含任何文件；
;  如需长期自定义，请修改 NSMMI 包内 Resources\Loader\d3dx.ini 后重新安装。
; ============================================================================

; ------------------------------------------------------------------------------------------------------
; 注入目标：3dmloader 注入后由本段确认游戏进程
; ------------------------------------------------------------------------------------------------------
[Loader]
target = nshm.exe

; ------------------------------------------------------------------------------------------------------
; Mod 加载（NSMMI 核心）：所有 mod 放入工作目录 Mod\ 下的 .ini 文件即可自动递归加载
; ------------------------------------------------------------------------------------------------------
[Include]
include_recursive = Mod
exclude_recursive = DISABLED*

; ------------------------------------------------------------------------------------------------------
; 日志（性能优先：全部关闭；排查问题时临时改为 calls=1）
; ------------------------------------------------------------------------------------------------------
[Logging]
calls=0
input=1
debug=0
unbuffered=0
force_cpu_affinity=0
convergence=0
separation=0
debug_locks=0

; ------------------------------------------------------------------------------------------------------
; 全局常量（可在 HLSL 中通过 IniParams 访问）
; ------------------------------------------------------------------------------------------------------
[Constants]
;global $some_variable = 0.0

; ------------------------------------------------------------------------------------------------------
; 猎取（Hunting）：启动即开启；F4 可随时开关
; 小键盘 1/2 浏览 PS，3 标记 PS；4/5 浏览 VS，6 标记 VS（需开启 NumLock）
; ------------------------------------------------------------------------------------------------------
[Hunting]
hunting=1
toggle_hunting = no_modifiers VK_F4
marking_mode=skip
next_marking_mode = no_modifiers VK_DECIMAL VK_NUMPAD0
marking_actions = clipboard regex hlsl asm snapshot_if_pink

previous_pixelshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD1
next_pixelshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD2
mark_pixelshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD3

previous_vertexshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD4
next_vertexshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD5
mark_vertexshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD6

previous_indexbuffer = no_modifiers NO_VK_DECIMAL VK_NUMPAD7
next_indexbuffer = no_modifiers NO_VK_DECIMAL VK_NUMPAD8
mark_indexbuffer = no_modifiers NO_VK_DECIMAL VK_NUMPAD9

previous_vertexbuffer = no_modifiers NO_VK_DECIMAL VK_DIVIDE
next_vertexbuffer = no_modifiers NO_VK_DECIMAL VK_MULTIPLY
mark_vertexbuffer = no_modifiers NO_VK_DECIMAL VK_SUBTRACT

verbose_overlay = 0
config_reload = no_modifiers VK_F10
wipe_user_config = ctrl alt VK_F10

; ------------------------------------------------------------------------------------------------------
; 设备 / 窗口
; ------------------------------------------------------------------------------------------------------
[Device]
upscaling = 0
full_screen=0
get_resolution_from = swap_chain
hide_cursor = 0
; 允许游戏 QueryInterface 到 ID3D11Device1 等新接口（Unity 类游戏需要）
allow_platform_update=1

; ------------------------------------------------------------------------------------------------------
; 渲染 / Shader 替换
; ------------------------------------------------------------------------------------------------------
[Rendering]
override_directory=ShaderFixes
cache_directory=ShaderCache
storage_directory=ShaderFromGame
cache_shaders=1

assemble_signature_comments = 1
shader_hash = 3dmigoto
texture_hash = 1

stereo_params = 125
ini_params = 120

rasterizer_disable_scissor=0
